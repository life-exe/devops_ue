name: Game Documentation

on:
  push:
    branches: 
    - master
  pull_request:
    branches: 
    - master

permissions:
  pages: write
  deployments: write
  id-token: write

jobs:
  docs:
    runs-on: windows-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check Installed Software
        run: where git & where python & where pip
        shell: cmd
        
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Doxygen
        run: choco install doxygen.install -y --no-progress

      - name: Run Doxygen
        run: '"C:\Program Files\doxygen\bin\doxygen.exe" "${{ github.workspace }}\devops_data\Doxyfile"'
        shell: cmd
        
      - name: Upload Docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation\html
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
